<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Conexión con TikTok | Diagnóstica PLUS</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .codigo { font-family: ui-monospace, Consolas, monospace; background: var(--blanco); border: 1px solid var(--linea); border-radius: 10px; padding: 1rem; word-break: break-all; margin-top: 1rem; }
  </style>
</head>
<body>
  <main class="legal">
    <div class="contenedor">
      <h1 id="titulo">Conectando con TikTok…</h1>
      <p id="texto">Esta página recibe la autorización de TikTok para la cuenta oficial de Diagnóstica PLUS.</p>
      <div id="resultado" hidden>
        <p>Copia este código y pégalo en la terminal donde se está conectando la cuenta. Caduca en unos minutos y solo sirve una vez.</p>
        <div class="codigo" id="codigo"></div>
        <p style="margin-top:1rem"><button class="boton boton-whatsapp" id="copiar" type="button">Copiar código</button></p>
      </div>
      <p style="margin-top:2rem"><a href="./">Volver al inicio</a></p>
    </div>
  </main>
  <script>
    const p = new URLSearchParams(location.search);
    const code = p.get("code");
    const titulo = document.getElementById("titulo");
    const texto = document.getElementById("texto");
    if (code) {
      titulo.textContent = "TikTok autorizó la conexión";
      texto.hidden = true;
      document.getElementById("resultado").hidden = false;
      document.getElementById("codigo").textContent = code;
      document.getElementById("copiar").onclick = async () => {
        await navigator.clipboard.writeText(code);
        document.getElementById("copiar").textContent = "Código copiado";
      };
      history.replaceState(null, "", location.pathname); // no dejar el código en el historial
    } else if (p.get("error")) {
      titulo.textContent = "No se completó la conexión";
      texto.textContent = "TikTok devolvió: " + (p.get("error_description") || p.get("error")) + ". Vuelve a intentarlo desde la terminal.";
    }
  </script>
</body>
</html>
